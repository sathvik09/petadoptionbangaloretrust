name: Deploy site

# Every push to main verifies the site, then publishes it to GitHub Pages.
# If verification fails, nothing is deployed and the live site stays as it was.
on:
  push:
    branches: [main]
  workflow_dispatch:      # also lets you deploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys rather than cancelling one midway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Check links and assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify every image path and anchor resolves
        run: ./scripts/check-site.sh

  deploy:
    name: Publish to GitHub Pages
    needs: verify           # only runs if verify passed
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Package the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .           # .git and .github are excluded automatically
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
